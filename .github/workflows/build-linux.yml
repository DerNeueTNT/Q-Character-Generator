name: Build Linux Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install colorama pyinstaller

      - name: Compile Linux executable
        run: python -m PyInstaller --onefile --name Q-Character_Generator main.py

      - name: Package Linux download
        shell: bash
        run: |
          set -e
          mkdir -p package/Q-Character_Generator_Linux
          cp dist/Q-Character_Generator package/Q-Character_Generator_Linux/

          cat > package/Q-Character_Generator_Linux/Q-Character_Generator.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Q-Character Generator
          Comment=Quick NPC generator for tabletop RPGs
          Exec=sh -c "cd \\"\\$(dirname \\"\\$1\\")\\" && exec ./Q-Character_Generator" launcher %k
          Terminal=true
          Icon=utilities-terminal
          Categories=Game;
          EOF

          chmod +x package/Q-Character_Generator_Linux/Q-Character_Generator
          chmod +x package/Q-Character_Generator_Linux/Q-Character_Generator.desktop
          tar -czf Q-Character_Generator_Linux.tar.gz -C package Q-Character_Generator_Linux
          echo 'Packaged files:'
          tar -tzf Q-Character_Generator_Linux.tar.gz

      - name: Upload Linux download
        uses: actions/upload-artifact@v4
        with:
          name: Linux-build
          path: Q-Character_Generator_Linux.tar.gz
          if-no-files-found: error
